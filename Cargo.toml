[package]
name = "rget"
version = "0.1.1"
edition = "2024"
authors = ["Ceka"]
description = "A simple downloader written in Rust"
license = "MIT"
repository = "https://github.com/ddCeka/rget"

[dependencies]
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = 'abort'
strip = true
