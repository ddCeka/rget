[package]
name = "rget"
version = "0.2.0"
edition = "2024"
authors = ["Ceka"]
description = "A simple downloader written in Rust"
license = "MIT"
repository = "https://github.com/ddCeka/rget"

[lib]
name = "rget"
crate-type = ["cdylib", "rlib"]

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["stream", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
jni = "0.21"

[profile.release]
lto = "thin"
codegen-units = 1
panic = 'abort'
strip = true
